<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Let's Work Together | Cristy Develleres</title>

    <meta
        name="description"
        content="Get in touch with Cristy Develleres for e-commerce and digital operations support."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <section class="contact-page">

            <div class="section-label">
                <span>01</span>
                <span>START A CONVERSATION</span>
            </div>

            <div class="contact-page-content">

                <p class="eyebrow">
                    E-COMMERCE / DIGITAL OPERATIONS
                </p>

                <h1>
                    Let's build
                    something that
                    <em>works.</em>
                </h1>

                <p class="contact-intro">
                    Tell me a little about your business,
                    what you need help with, or what you're
                    currently working on.
                </p>

                <form
    action="https://formspree.io/f/xjybdnqn"
    method="POST"
    class="contact-form"
>


                    <div class="form-field">

                        <label for="name">
                            NAME
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="message">
                            MESSAGE
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Tell me about your project or what you need help with..."
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="contact-submit"
                    >
                        SEND MESSAGE ↗
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
