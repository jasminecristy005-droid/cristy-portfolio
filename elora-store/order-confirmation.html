<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | ÉLORA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">ÉLORA</a>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="shop.html">Shop</a>
                </li>

                <li>
                    <a href="cart.html">Bag</a>
                </li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="confirmation-page">

            <div class="confirmation-card">

                <p class="eyebrow">
                    THANK YOU
                </p>

                <div class="success-icon">
                    ✓
                </div>

                <h1>
                    Order Confirmed
                </h1>

                <p class="confirmation-message">
                    Thank you for choosing ÉLORA.
                    Your order has been received successfully.
                </p>


                <div class="order-number">

                    <span>
                        Order Number
                    </span>

                    <strong id="orderId">
                        Loading...
                    </strong>

                </div>


                <div
                    class="confirmation-details"
                    id="orderDetails"
                >
                </div>


                <div class="confirmation-actions">

                    <a
                        href="shop.html"
                        class="confirmation-button"
                    >
                        Continue Shopping
                    </a>

                    <a
                        href="#"
                        id="trackOrder"
                        class="confirmation-button secondary"
                    >
                        Track Order
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="js/order-confirmation.js"></script>

</body>

</html>
