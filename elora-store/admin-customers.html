    <!-- CUSTOMER SCRIPT -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            loadCustomers
        );


        async function loadCustomers() {

            const tableBody =
                document.getElementById(
                    "customersTableBody"
                );


            const {
                data: orders,
                error
            } = await supabaseClient
                .from("elora_orders")
                .select(
                    "customer_name, customer_email, phone, total"
                );


            if (error) {

                console.error(
                    "ÉLORA Customers Error:",
                    error
                );


                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6">
    Unable to load customers.
</td>
                    </tr>
                `;

                return;

            }


            if (!orders || orders.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6">
    No customers yet.
</td>
                    </tr>
                `;

                return;

            }

            // GROUP CUSTOMERS

            const customers = {};


            orders.forEach(order => {

                const email =
                    order.customer_email;


                if (!customers[email]) {

                    customers[email] = {

                        name:
                            order.customer_name || "-",

                        email:
                            email || "-",

                        phone:
                            order.phone || "-",

                        orders: 0,

                        totalSpent: 0

                    };

                }


                customers[email].orders += 1;


                customers[email].totalSpent +=
                    Number(order.total || 0);

            });



            const customerList =
                Object.values(customers);



            // RENDER

            tableBody.innerHTML =
                customerList.map(customer => `

                    <tr>

    <td>
        <strong>
            ${customer.name}
        </strong>
    </td>

    <td>
        ${customer.email}
    </td>

    <td>
        ${customer.phone}
    </td>

    <td>
        ${customer.orders}
    </td>

    <td>
        $${customer.totalSpent.toFixed(2)}
    </td>

    <td>
        <button
            type="button"
            class="view-customer-button"
            onclick="viewCustomer('${customer.email}')"
        >
            View
        </button>
    </td>

</tr>

                `).join("");

        }
// =========================
// VIEW CUSTOMER DETAILS
// =========================

async function viewCustomer(customerEmail) {

    console.log(
        "ÉLORA VIEW CUSTOMER:",
        customerEmail
    );

    const {
        data: orders,
        error
    } = await supabaseClient
        .from("elora_orders")
        .select("*")
        .eq(
            "customer_email",
            customerEmail
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "ÉLORA CUSTOMER ERROR:",
            error
        );

        alert(
            "Unable to load customer details."
        );

        return;
    }


    if (!orders || orders.length === 0) {

        alert(
            "No orders found for this customer."
        );

        return;
    }


    const customer =
        orders[0];


    const totalSpent =
        orders.reduce(
            (sum, order) =>
                sum + Number(order.total || 0),
            0
        );


    const modal =
        document.getElementById(
            "customerModal"
        );


    const modalName =
        document.getElementById(
            "modalCustomerName"
        );


    const modalBody =
        document.getElementById(
            "customerModalBody"
        );


    modalName.textContent =
        customer.customer_name || "-";


    const orderHistoryHTML =
        orders.map(order => `

            <div class="order-detail-product">

                <div>

                    <strong>
                        ${order.order_id || "-"}
                    </strong>

                    <span>
                        ${
                            order.created_at
                                ? new Date(
                                    order.created_at
                                ).toLocaleString(
                                    "en-PH",
                                    {
                                        dateStyle: "medium",
                                        timeStyle: "short"
                                    }
                                )
                                : "-"
                        }
                    </span>

                </div>


                <div
                    class="order-detail-product-right"
                >

                    <span>
                        ${order.status || "-"}
                    </span>

                    <strong>
                        $${Number(
                            order.total || 0
                        ).toFixed(2)}
                    </strong>

                </div>

            </div>

        `).join("");


    modalBody.innerHTML = `

        <div class="order-detail-section">

            <h3>
                Customer Information
            </h3>

            <div class="order-detail-grid">

                <div>
                    <span>
                        Name
                    </span>

                    <strong>
                        ${customer.customer_name || "-"}
                    </strong>
                </div>


                <div>
                    <span>
                        Email
                    </span>

                    <strong>
                        ${customer.customer_email || "-"}
                    </strong>
                </div>


                <div>
                    <span>
                        Phone
                    </span>

                    <strong>
                        ${customer.phone || "-"}
                    </strong>
                </div>

            </div>

        </div>


        <div class="order-detail-section">

            <h3>
                Customer Summary
            </h3>

            <div class="order-summary-detail">

                <div>
                    <span>
                        Total Orders
                    </span>

                    <strong>
                        ${orders.length}
                    </strong>
                </div>


                <div class="order-grand-total">

                    <span>
                        Total Spent
                    </span>

                    <strong>
                        $${totalSpent.toFixed(2)}
                    </strong>

                </div>

            </div>

        </div>


        <div class="order-detail-section">

            <h3>
                Order History
            </h3>

            <div class="order-detail-products">

                ${orderHistoryHTML}

            </div>

        </div>

    `;


    modal.style.display =
        "flex";

}
// =========================
// CLOSE CUSTOMER MODAL
// =========================

const closeCustomerButton =
    document.getElementById(
        "closeCustomerModal"
    );

const customerModal =
    document.getElementById(
        "customerModal"
    );


if (
    closeCustomerButton &&
    customerModal
) {

    closeCustomerButton.addEventListener(
        "click",
        () => {

            customerModal.style.display =
                "none";

        }
    );


    customerModal.addEventListener(
        "click",
        (event) => {

            if (
                event.target ===
                customerModal
            ) {

                customerModal.style.display =
                    "none";

            }

        }
    );

}
