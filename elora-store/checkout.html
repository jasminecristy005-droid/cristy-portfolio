<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ÉLORA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">ÉLORA</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Bag</a></li>
            </ul>

        </nav>
    </header>


    <!-- CHECKOUT -->

    <main>

        <section class="checkout-page">

            <div class="checkout-heading">

                <p class="eyebrow">ÉLORA</p>

                <h1>Checkout</h1>

                <p>
                    Complete your details to place your order.
                </p>

            </div>


            <div class="checkout-layout">


                <!-- CUSTOMER INFORMATION -->

                <form
                    id="checkoutForm"
                    class="checkout-form"
                >

                    <div class="form-section">

                        <h2>Contact Information</h2>

                        <div class="form-group">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Your full name"
                                required
                            >

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="email">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="you@example.com"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="phone">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="+63"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- SHIPPING -->

                    <div class="form-section">

                        <h2>Shipping Address</h2>


                        <div class="form-group">

                            <label for="address">
                                Address
                            </label>

                            <input
                                type="text"
                                id="address"
                                name="address"
                                placeholder="Street address"
                                required
                            >

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    name="city"
                                    placeholder="City"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="province">
                                    Province
                                </label>

                                <input
                                    type="text"
                                    id="province"
                                    name="province"
                                    placeholder="Province"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="postalCode">
                                Postal Code
                            </label>

                            <input
                                type="text"
                                id="postalCode"
                                name="postalCode"
                                placeholder="Postal code"
                                required
                            >

                        </div>

                    </div>


                    <!-- PAYMENT -->

                    <div class="form-section">

                        <h2>Payment Method</h2>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="paymentMethod"
                                value="Cash on Delivery"
                                checked
                            >

                            <span>
                                Cash on Delivery
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="paymentMethod"
                                value="GCash"
                            >

                            <span>
                                GCash
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="paymentMethod"
                                value="Bank Transfer"
                            >

                            <span>
                                Bank Transfer
                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        Place Order
                    </button>

                </form>


                <!-- ORDER SUMMARY -->

                <aside class="checkout-summary">

                    <h2>Your Order</h2>

                    <div id="checkoutItems">

                        <!-- JavaScript loads products here -->

                    </div>


                    <div class="checkout-summary-line">

                        <span>Subtotal</span>

                        <strong id="checkoutSubtotal">
                            $0
                        </strong>

                    </div>


                    <div class="checkout-summary-line">

                        <span>Shipping</span>

                        <strong>
                            Free
                        </strong>

                    </div>


                    <div class="summary-divider"></div>


                    <div class="checkout-total">

                        <span>Total</span>

                        <strong id="checkoutTotal">
                            $0
                        </strong>

                    </div>

                </aside>

            </div>

        </section>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/checkout.js"></script>

</body>

</html>
